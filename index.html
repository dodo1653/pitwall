  const L = SEATS * SEAT_W
  // desk: walnut top, a dark modesty panel, two legs
  const top = new THREE.Mesh(new THREE.BoxGeometry(L + .2, .05, .92), deskM); top.position.set(0, .75, -.42); grp.add(top)
  const pan = new THREE.Mesh(new THREE.BoxGeometry(L, .62, .04), darkM); pan.position.set(0, .42, -.86); grp.add(pan)
  for (const s of [-1, 1]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(.05, .72, .8), darkM); leg.position.set(s * L / 2, .37, -.42); grp.add(leg) }
  // the screen strip: 8 monitors, one canvas across all of them
  const cv = document.createElement('canvas'); cv.width = 2560; cv.height = 190
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8
  const N = SEATS * MON, mw = .58, mh = .34, geos = []
  for (let i = 0; i < N; i++) {
    const g = new THREE.PlaneGeometry(mw, mh), uv = g.attributes.uv
    for (let j = 0; j < uv.count; j++) uv.setX(j, (i + uv.getX(j)) / N)
    const cx = -L / 2 + SEAT_W / 2 + Math.floor(i / 2) * SEAT_W + (i % 2 ? .3 : -.3)
    g.rotateY((i % 2 ? -1 : 1) * .12); g.translate(cx, 1.13, -.72); geos.push(g)
  }
  const screens = new THREE.Mesh(mergeGeometries(geos), new THREE.MeshBasicMaterial({ map: tex, color: new THREE.Color(1.6, 1.6, 1.6) })); grp.add(screens)
  const bez = []; for (let i = 0; i < N; i++) { const b = new THREE.BoxGeometry(mw + .03, mh + .03, .03); b.rotateY((i % 2 ? -1 : 1) * .12); b.translate(-L / 2 + SEAT_W / 2 + Math.floor(i / 2) * SEAT_W + (i % 2 ? .3 : -.3), 1.13, -.74); bez.push(b); const st = new THREE.BoxGeometry(.04, .22, .04); st.translate(-L / 2 + SEAT_W / 2 + Math.floor(i / 2) * SEAT_W + (i % 2 ? .3 : -.3), .88, -.76); bez.push(st) }
  grp.add(new THREE.Mesh(mergeGeometries(bez), darkM))
  // keyboards glow faintly
  const kb = []; for (let s = 0; s < SEATS; s++) { const b = new THREE.BoxGeometry(.44, .02, .15); b.translate(-L / 2 + SEAT_W / 2 + s * SEAT_W, .785, -.3); kb.push(b) }
  grp.add(new THREE.Mesh(mergeGeometries(kb), darkM))
  // the traders
  const parts = new Map()
  for (let s = 0; s < SEATS; s++) for (const [geo, m] of seatedTrader(-L / 2 + SEAT_W / 2 + s * SEAT_W, .25, k * 4 + s)) { if (!parts.has(m)) parts.set(m, []); parts.get(m).push(geo) }
  const people = []; for (const [m, gs] of parts) { const mesh = new THREE.Mesh(mergeGeometries(gs), m); grp.add(mesh); people.push(mesh) }
  // the screens light the desk, the traders and the floor in the squad's colour
  const light = new THREE.PointLight(0xffffff, 3, 5.5, 1.7); light.position.set(0, 1.15, -.35); grp.add(light)
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(L + 3, 4), poolMat()); pool.rotation.x = -Math.PI / 2; pool.position.set(0, .015, -.2); grp.add(pool)
  pods.push({ k, P, grp, cv, tex, light, pool, people, entry: null, drawnFor: '' })
}
function poolMat() {
  const c = document.createElement('canvas'); c.width = c.height = 128
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128)
  return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: 0x000000 })
}
// one squad's terminal, drawn across its eight screens
function drawPod(p) {
  const e = p.entry, g = p.cv.getContext('2d'), w = 2560, h = 190, sw = 320, up = e.pnl >= 0, col = up ? '#4fd18b' : '#ff6157'
  const panel = (i, fn) => { g.save(); g.translate(i * sw, 0); g.fillStyle = '#05070a'; g.fillRect(0, 0, sw, h); g.beginPath(); g.rect(0, 0, sw, h); g.clip(); fn(); g.restore() }
  const fit = (txt, max, size, weight = 700, fam = 'Inter') => { let f = size; do { g.font = `${weight} ${f}px ${fam}`; f -= 2 } while (g.measureText(txt).width > max && f > 14); return txt }
  const label = (txt, y = 34) => { g.fillStyle = 'rgba(255,255,255,.45)'; g.font = '600 17px Inter'; g.fillText(txt, 22, y) }
  g.textBaseline = 'middle'
  panel(0, () => { label('RANK'); g.fillStyle = '#fff'; g.font = '700 92px JetBrains Mono'; g.fillText('#' + e.rank, 18, 116) })
  panel(1, () => { label('SQUAD'); g.fillStyle = '#fff'; g.fillText(fit(e.name, sw - 40, 50), 22, 104); g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '500 18px Inter'; g.fillText(e.members + ' traders', 22, 156) })
  panel(2, () => { label('PROFIT'); g.fillStyle = col; g.fillText(fit(usd(e.pnl), sw - 40, 66, 700, 'JetBrains Mono'), 20, 112) })
  panel(3, () => {
    const tot = Math.abs(e.realized) + Math.abs(e.unrealized) || 1
    for (const [i, lab, v] of [[0, 'REALIZED', e.realized], [1, 'UNREALIZED', e.unrealized]]) {
      const y = 40 + i * 74
      g.fillStyle = 'rgba(255,255,255,.45)'; g.font = '600 16px Inter'; g.fillText(lab, 22, y)
      g.fillStyle = '#fff'; g.font = '600 22px JetBrains Mono'; g.fillText(usd(v), 22, y + 30)
      g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(150, y + 24, 148, 10); g.fillStyle = v >= 0 ? '#4fd18b' : '#ff6157'; g.fillRect(150, y + 24, 148 * Math.abs(v) / tot, 10)
    }
  })
  ;(e.top || []).slice(0, 3).forEach((c, i) => panel(4 + i, () => { label('HOLDING'); g.fillStyle = '#fff'; g.fillText(fit('$' + (c.symbol || ''), sw - 40, 54, 700, 'JetBrains Mono'), 22, 100); g.fillStyle = 'rgba(255,255,255,.45)'; g.font = '500 16px Inter'; g.fillText(fit(c.name || '', sw - 44, 16, 500), 22, 150) }))
  for (let i = 4 + Math.min(3, (e.top || []).length); i < 7; i++) panel(i, () => label('HOLDING'))
  panel(7, () => { label('POSITIONS'); g.fillStyle = '#fff'; g.font = '700 70px JetBrains Mono'; g.fillText(String(e.positions), 20, 108); g.fillStyle = 'rgba(255,255,255,.45)'; g.font = '500 16px Inter'; g.fillText(e.spentSol.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' SOL spent', 22, 160) })
  for (let i = 0; i < 8; i++) { g.fillStyle = col; g.globalAlpha = .55; g.fillRect(i * sw, h - 4, sw, 4); g.globalAlpha = 1 }
  p.tex.needsUpdate = true
}
function updatePods() {
  for (const p of pods) {
    const e = board.entries[p.k]; p.entry = e; p.grp.visible = !!e
    if (!e) continue
    const key = e.id + e.pnl + e.rank
    if (p.drawnFor !== key) { drawPod(p); p.drawnFor = key }
    const up = e.pnl >= 0, rankK = 1 - p.k / PODS
    const c = new THREE.Color(up ? 0x8fffc0 : 0xff8a80).lerp(new THREE.Color(0xdfe6ff), .62)
    p.light.color.copy(c); p.light.intensity = 1.6 + 3.2 * rankK
    p.pool.material.color.copy(c).multiplyScalar(.12 + .22 * rankK)
  }
}

// ------------------------------------------------------------------ post
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .7, .6, .82); composer.addPass(bloom)
composer.addPass(new OutputPass())
const grade = new ShaderPass({ uniforms: { tDiffuse: { value: null }, t: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float t; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + t * 7.13) * 43758.5453); }
    void main(){ vec2 d = vUv - .5; vec3 c = texture2D(tDiffuse, vUv).rgb; c *= 1. - dot(d, d) * 1.15; c = mix(c, c * vec3(1.02, 1., .96), .5); c += (h(vUv * 1000.) - .5) * .028; gl_FragColor = vec4(c, 1.); }` })
composer.addPass(grade)

// ------------------------------------------------------------------ data
let board = null, prevBoard = null, events = [], selected = null
async function load() {
  let d = null
  const src = CAPTURE ? Q.get('board') : '/api/board'
  if (src) { try { const r = await fetch(src, { cache: 'no-store' }); if (r.ok) d = await r.json() } catch {} }
  if (!d || !d.entries) d = await (await fetch('data/snapshot.json')).json()
  if (!d.competition || !d.competition.endsAt) d.competition = (await (await fetch('data/snapshot.json')).json()).competition
  if (board && d.builtAtMs !== board.builtAtMs) { prevBoard = board; diff(prevBoard, d) }
  board = d
}
function diff(a, b) {
  const pa = new Map(a.entries.map((e) => [e.id, e])), now = performance.now()
  for (const e of b.entries.slice(0, PODS)) {
    const o = pa.get(e.id); if (!o) continue
    if (e.rank < o.rank && e.rank <= 10) { const passed = b.entries.find((x) => x.rank === e.rank + 1); events.push({ at: now, tag: e.rank === 1 ? 'NEW LEADER' : 'MOVES UP', text: `${e.name}${passed ? ' passes ' + passed.name : ''}`, small: `#${o.rank} → #${e.rank}` }) }
  }
  let best = null
  for (const e of b.entries) { const o = pa.get(e.id); if (o && (!best || e.pnl - o.pnl > best.d)) best = { e, d: e.pnl - o.pnl } }
  if (best && best.d > 2000) events.push({ at: now, tag: 'BIGGEST MOVE', text: best.e.name, small: usd(best.d) + ' since the last update' })
}

// ------------------------------------------------------------------ camera: a slow film director, free look on drag
let camMode = 'auto', lastPose = null, blendFrom = null, blendAt = 0
const orbit = { target: new THREE.Vector3(0, 1, -2), yaw: 1.2, pitch: .45, dist: 22 }
const SHOT = 9
function shotPose(kind, a) {
  if (kind === 0) {                 // high corner, drifting: the whole floor and the wall
    return { pos: new THREE.Vector3(17 - a * .35, 9.2 - a * .1, 15.5), look: new THREE.Vector3(-1, 1.4, -6) }
  } else if (kind === 1) {          // down the centre aisle at seated eye height
    return { pos: new THREE.Vector3(0, 1.7, 13.5 - a * .9), look: new THREE.Vector3(0, 2.3, -16) }
  } else if (kind === 2) {          // over the leader's shoulders onto their screens
    const P = podPos(0)
    return { pos: new THREE.Vector3(P.x + 2.4 - a * .14, 1.95, P.z + 3.6 - a * .06), look: new THREE.Vector3(P.x - .2, 1.12, P.z - .72) }
  } else if (kind === 3) {          // the leaderboard wall
    return { pos: new THREE.Vector3(-2 + a * .18, 2.6, 7.5 - a * .25), look: new THREE.Vector3(0, 3.5, -16) }
  } else {                          // along a row of desks from the side, low
    const P = podPos(4 + 2)
    return { pos: new THREE.Vector3(19.5 - a * .4, 1.25, P.z + 1.9), look: new THREE.Vector3(-6, 1.1, P.z - .4) }
  }
}
const ORDER = [0, 1, 2, 4, 3, 2]
function directorPose(T) {
  const k = Math.floor(T / SHOT), kind = ORDER[k % ORDER.length], prev = ORDER[(k + ORDER.length - 1) % ORDER.length]
  const cur = shotPose(kind, T - k * SHOT), f = ease((T - k * SHOT) / 2.2)
  if (f < 1) { const p = shotPose(prev, SHOT + (T - k * SHOT)); cur.pos.lerpVectors(p.pos, cur.pos, f); cur.look.lerpVectors(p.look, cur.look, f) }
  return cur
}
{
  const cv = renderer.domElement; let down = null, moved = 0
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); down = { b: e.button }; moved = 0 })
  cv.addEventListener('pointermove', (e) => {
    if (!down) return
    const dx = e.movementX, dy = e.movementY; moved += Math.abs(dx) + Math.abs(dy); if (moved < 4) return
    if (camMode === 'auto' && lastPose) { const d = lastPose.pos.clone().sub(lastPose.look); orbit.target.copy(lastPose.look); orbit.dist = d.length(); orbit.pitch = Math.asin(clamp(d.y / orbit.dist, -1, 1)); orbit.yaw = Math.atan2(d.z, d.x); camMode = 'free'; $('auto').style.display = 'block' }
    cv.classList.add('drag')
    if (down.b === 2 || e.shiftKey) { const s = orbit.dist * .0016; orbit.target.x += (Math.sin(orbit.yaw) * dx + Math.cos(orbit.yaw) * dy) * s; orbit.target.z += (-Math.cos(orbit.yaw) * dx + Math.sin(orbit.yaw) * dy) * s }
    else { orbit.yaw += dx * .005; orbit.pitch = clamp(orbit.pitch + dy * .004, .04, 1.45) }
  })
  const up = () => { down = null; cv.classList.remove('drag') }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('contextmenu', (e) => e.preventDefault())
  cv.addEventListener('wheel', (e) => { e.preventDefault(); if (camMode === 'auto') return; orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * .0012), 2, 40) }, { passive: false })
  $('auto').onclick = () => { blendFrom = lastPose; blendAt = performance.now(); camMode = 'auto'; $('auto').style.display = 'none' }
}

// ------------------------------------------------------------------ overlay
function renderTower() {
  const e = board.entries, pa = prevBoard ? new Map(prevBoard.entries.map((x) => [x.id, x.rank])) : null
  $('rows').innerHTML = e.slice(0, 20).map((x, i) => {
    const gap = i === 0 ? 'LEADER' : '-' + usdPlain(e[0].pnl - x.pnl).slice(1)
    const was = pa && pa.get(x.id), mv = was && was !== x.rank ? (was > x.rank ? '<span class="mv" style="color:var(--up)">▲</span>' : '<span class="mv" style="color:var(--down)">▼</span>') : ''
    return `<div class="row${selected === x.id ? ' sel' : ''}" data-id="${esc(x.id)}">${mv}<span class="p">${x.rank}</span>${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : '<span class="av"></span>'}<span class="nm">${esc(x.name)}</span><span class="pnl" style="color:${x.pnl >= 0 ? 'var(--up)' : 'var(--down)'}">${usd(x.pnl)}</span><span class="gap">${gap}</span></div>`
  }).join('')
  for (const r of document.querySelectorAll('#rows .row')) r.onclick = () => select(r.dataset.id)
  $('field').textContent = (board.competition?.entriesCount || board.totalRanked || e.length).toLocaleString('en-US')
  $('stamp').textContent = 'Standings ' + new Date(board.builtAtMs).toISOString().slice(0, 16).replace('T', ' ') + ' UTC'
}
function renderPit() {
  const top = board.entries.slice(0, 10), m = new Map()
  for (const x of top) for (const c of x.top || []) { const k = m.get(c.mint) || { ...c, squads: [] }; k.squads.push(x); m.set(c.mint, k) }
  const list = [...m.values()].sort((a, b) => b.squads.length - a.squads.length || a.squads[0].rank - b.squads[0].rank).slice(0, 7)
  $('coins').innerHTML = list.map((c) => `<a class="coin" href="https://pump.fun/coin/${encodeURIComponent(c.mint)}" target="_blank" rel="noopener">${c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy">` : '<span></span>'}<div><div class="t">$${esc(c.symbol || '')}</div><div class="w">${c.squads.map((s) => esc(s.name)).join(', ')}</div></div><div class="k">${c.squads.length}<small>OF TOP 10</small></div></a>`).join('')
}
function select(id) {
  selected = id; renderTower()
  const x = board.entries.find((e) => e.id === id); if (!x) { $('card').classList.remove('on'); return }
  $('card').innerHTML = `<button class="x" id="cx">&times;</button>
    <div class="hd">${x.img ? `<img src="${esc(x.img)}" alt="">` : ''}<div><b>${esc(x.name)}</b><span>#${x.rank} · ${x.members} traders</span></div></div>
    <div class="big" style="color:${x.pnl >= 0 ? 'var(--up)' : 'var(--down)'}">${usd(x.pnl)}</div>
    <div class="grid"><div><b>${usd(x.realized)}</b><span>Realized</span></div><div><b>${usd(x.unrealized)}</b><span>Unrealized</span></div><div><b>${x.spentSol.toLocaleString('en-US', { maximumFractionDigits: 0 })}</b><span>SOL spent</span></div></div>
    <div class="grid"><div><b>${x.positions}</b><span>Positions</span></div><div><b>${x.rank === 1 ? '-' : usdPlain(board.entries[0].pnl - x.pnl)}</b><span>Gap to #1</span></div><div><b>${x.members}</b><span>Members</span></div></div>
    <div style="font-size:10px;letter-spacing:.16em;color:var(--faint);margin:6px 0 2px">TOP HOLDINGS</div>
    ${(x.top || []).map((c) => `<a class="coin" href="https://pump.fun/coin/${encodeURIComponent(c.mint)}" target="_blank" rel="noopener">${c.img ? `<img src="${esc(c.img)}" alt="">` : '<span></span>'}<div><div class="t">$${esc(c.symbol || '')}</div><div class="w">${esc(c.name || '')}</div></div><div></div></a>`).join('')}`
  $('cx').onclick = () => { selected = null; $('card').classList.remove('on'); renderTower() }
  $('card').classList.add('on')
  // fly to that squad's desk when it is on the floor
  const k = board.entries.indexOf(x)
  if (k >= 0 && k < PODS) { const P = podPos(k); orbit.target.set(P.x, 1.1, P.z - .5); orbit.dist = 5.2; orbit.yaw = 1.25; orbit.pitch = .32; camMode = 'free'; $('auto').style.display = 'block' }
}
$('moreBtn').onclick = () => {
  const f = $('full'); f.classList.toggle('on')
  if (!f.classList.contains('on')) return
  f.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font:600 14px Inter;letter-spacing:.2em">FULL STANDINGS</b><button style="border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer" onclick="document.getElementById('full').classList.remove('on')">&times;</button></div>` +
    board.entries.map((x) => `<div class="row" data-id="${esc(x.id)}" style="grid-template-columns:40px 22px 1fr 110px 90px 110px"><span class="p">${x.rank}</span>${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : '<span class="av"></span>'}<span class="nm">${esc(x.name)}</span><span class="pnl" style="color:${x.pnl >= 0 ? 'var(--up)' : 'var(--down)'}">${usd(x.pnl)}</span><span class="gap">${x.members} traders</span><span class="gap">${x.positions} positions</span></div>`).join('')
  for (const r of f.querySelectorAll('.row')) r.onclick = () => { f.classList.remove('on'); select(r.dataset.id) }
}
function updateBroadcast(now) {
  const ev = events.find((e) => now - e.at < 7000)
  if (ev) { $('bcTag').textContent = ev.tag; $('bcTxt').innerHTML = `${esc(ev.text)} <small>${esc(ev.small)}</small>`; $('bc').classList.add('on') } else $('bc').classList.remove('on')
  events = events.filter((e) => now - e.at < 60000)
}
const tmpV = new THREE.Vector3()
function updateTags() {
  const html = [], placed = []
  for (const p of pods.slice(0, 12)) {
    if (!p.entry) continue
    tmpV.set(p.P.x, 2.05, p.P.z - .7).project(camera)
    if (tmpV.z > 1 || Math.abs(tmpV.x) > .92 || tmpV.y > .8 || tmpV.y < -.85) continue
    const x = (tmpV.x * .5 + .5) * W, y = (-tmpV.y * .5 + .5) * H
    if (placed.some(([a, b]) => Math.abs(a - x) < 150 && Math.abs(b - y) < 34)) continue
    placed.push([x, y])
    html.push(`<div class="tagp" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px"><i>#${p.entry.rank}</i>${esc(p.entry.name)}<small style="color:${p.entry.pnl >= 0 ? 'var(--up)' : 'var(--down)'}">${usd(p.entry.pnl)}</small></div>`)
  }
  $('tags').innerHTML = html.join('')
}

// ------------------------------------------------------------------ frame
let wallAt = -1
function frame(t) {
  updatePods()
  if (Math.floor(t) !== wallAt) { drawWall(); wallAt = Math.floor(t) }
  let pose = directorPose(t)
  if (camMode === 'free') { const o = orbit, cp = Math.cos(o.pitch); pose = { pos: new THREE.Vector3(o.target.x + Math.cos(o.yaw) * cp * o.dist, Math.max(.4, o.target.y + Math.sin(o.pitch) * o.dist), o.target.z + Math.sin(o.yaw) * cp * o.dist), look: o.target.clone() } }
  else if (blendFrom) { const f = ease((performance.now() - blendAt) / 2400); if (f >= 1) blendFrom = null; else pose = { pos: blendFrom.pos.clone().lerp(pose.pos, f), look: blendFrom.look.clone().lerp(pose.look, f) } }
  lastPose = pose
  camera.position.copy(pose.pos); camera.lookAt(pose.look)
  grade.uniforms.t.value = t % 100
  composer.render()
  updateTags(); updateBroadcast(performance.now())
  $('cd').textContent = cdText(); $('prize').textContent = '$' + (+board.competition.prizeCopy / 1e6).toFixed(1) + 'M'
}
addEventListener('resize', () => { W = innerWidth; H = innerHeight; renderer.setSize(W, H); composer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix() })

// the coin's CA bar (only once a CA is set in project.config.js)
if (PROJECT.mint) {
  $('caT').textContent = '$' + PROJECT.ticker; $('caV').textContent = PROJECT.mint.slice(0, 6) + '…' + PROJECT.mint.slice(-6)
  $('caPf').href = 'https://pump.fun/coin/' + encodeURIComponent(PROJECT.mint); $('ca').classList.add('on')
  $('caCopy').onclick = () => { navigator.clipboard?.writeText(PROJECT.mint); $('caCopy').textContent = 'Copied'; setTimeout(() => { $('caCopy').textContent = 'Copy CA' }, 1500) }
}
await load(); renderTower(); renderPit()
if (CAPTURE) { document.body.classList.add('capture'); window.DURATION = +(Q.get('dur') || 20); window.renderFrame = (t) => frame(t); frame(0) }
else {
  setInterval(async () => { await load(); renderTower(); renderPit(); if (selected) select(selected) }, 60000)
  const t0 = performance.now(); const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop) }; loop()
}
window.READY = true
</script>
