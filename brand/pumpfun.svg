<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <!-- pump.fun's pill logo, redrawn as a vector from the official mark (colours sampled from it) -->
  <defs>
    <clipPath id="cap"><rect x="14" y="78" width="222" height="94" rx="47"/></clipPath>
  </defs>
  <g transform="rotate(-45 125 125)">
    <g clip-path="url(#cap)">
      <rect x="0" y="60" width="125" height="130" fill="#52d390"/>
      <rect x="125" y="60" width="125" height="130" fill="#ffffff"/>
      <!-- soft shade along the lower side of the white half -->
      <path d="M125 150 H190 A44 44 0 0 0 232 128 V172 H125 Z" fill="#bdd0d4" opacity="0.95"/>
      <!-- a darker rim along the lower side of the green half -->
      <path d="M14 152 H125 V172 H14 Z" fill="#3fbf7c" opacity="0.55"/>
    </g>
    <!-- highlight on the green half -->
    <path d="M44 106 Q38 116 40 128" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M42 136 L42 140" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <!-- outline + the seam -->
    <rect x="14" y="78" width="222" height="94" rx="47" fill="none" stroke="#123b34" stroke-width="9"/>
    <line x1="125" y1="80" x2="125" y2="170" stroke="#123b34" stroke-width="9"/>
  </g>
</svg>
