<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } svg { display: block; }</style>
</head>
<body>
<svg id="s" width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trailW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="trailG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe39a" stop-opacity=".6"/><stop offset="1" stop-color="#5fe39a" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff" stop-opacity="1"/><stop offset=".8" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="fadeX"><rect width="1000" height="1000" fill="url(#edge)"/></mask>
    <radialGradient id="glowW" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fe39a" stop-opacity=".38"/><stop offset="1" stop-color="#5fe39a" stop-opacity="0"/></radialGradient>
    <!-- a race car seen from above, nose up, 100 units long -->
    <symbol id="car" viewBox="-30 -55 60 110" overflow="visible">
      <rect x="-27" y="-54" width="54" height="9" rx="2"/>                 <!-- front wing -->
      <rect x="-7" y="-50" width="14" height="96" rx="7"/>                 <!-- nose + body -->
      <rect x="-17" y="-8" width="34" height="38" rx="9"/>                 <!-- sidepods -->
      <rect x="-24" y="38" width="48" height="11" rx="2"/>                 <!-- rear wing -->
      <rect x="-27" y="-38" width="9" height="17" rx="2.5"/><rect x="18" y="-38" width="9" height="17" rx="2.5"/>   <!-- front tyres -->
      <rect x="-28" y="14" width="10" height="20" rx="2.5"/><rect x="18" y="14" width="10" height="20" rx="2.5"/>   <!-- rear tyres -->
      <ellipse cx="0" cy="-2" rx="4.5" ry="7" fill="#000"/>              <!-- cockpit -->
    </symbol>
  </defs>
  <rect width="1000" height="1000" fill="#000"/>
  <g id="g"></g>
</svg>
<script>
const Q = new URLSearchParams(location.search)
const NS = 'http://www.w3.org/2000/svg', g = document.getElementById('g')
const el = (t, a, p = g) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
const S = +(Q.get('s') || 1), OY = +(Q.get('oy') || 0)
const root = el('g', { transform: `translate(500 ${500 + OY}) scale(${S}) translate(-500 -500)` })
// the finish line: two rows of chequers across the top, fading at the ends
const fin = el('g', { mask: 'url(#fadeX)' }, root)
const FY = 168, Q_ = 26
for (let i = 0; i < 1000 / Q_; i++) for (let r = 0; r < 2; r++) if ((i + r) % 2 === 0) el('rect', { x: i * Q_, y: FY + r * Q_, width: Q_, height: Q_, fill: '#fff', opacity: .9 }, fin)
// two squads in V formation, head to head: white on the left, green on the right (the green squad's leader is a nose ahead)
function squad(cx, lead, color, trail, glow) {
  const slots = [[0, 0], [-62, 92], [62, 92], [-124, 184], [124, 184]]
  for (const [dx, dy] of slots) {
    const x = cx + dx * .9, y = lead + dy
    el('rect', { x: x - 9, y: y + 52, width: 18, height: 230 - dy * .45, fill: `url(#${trail})` }, root)
  }
  el('ellipse', { cx, cy: lead + 70, rx: 190, ry: 190, fill: `url(#${glow})` }, root)
  for (const [dx, dy] of slots) {
    const x = cx + dx * .9, y = lead + dy
    el('use', { href: '#car', x: x - 30, y: y - 55, width: 60, height: 110, fill: color }, root)
  }
}
squad(318, 300, '#f4f4f2', 'trailW', 'glowW')
squad(682, 276, '#5fe39a', 'trailG', 'glowG')
if (Q.get('text')) { const t = el('text', { x: 500, y: 930, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'Titillium Web', 'font-weight': 700, 'font-size': 66, 'letter-spacing': 20 }, root); t.textContent = 'SQUAD WARS' }
document.fonts.ready.then(() => { window.READY = true })
</script>
</body>
</html>
