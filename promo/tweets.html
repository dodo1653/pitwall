<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Squad Trenchers: tweets cut</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  #mint { background: radial-gradient(ellipse at 50% 55%, #b9f7cf 0%, #e8fbef 46%, #f6fff9 100%); }
  #rings { position: absolute; left: 50%; top: 50%; }
  .ring { position: absolute; border: 3px solid #36d97c; border-radius: 50%; transform: translate(-50%, -50%); }
  .type { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; font: 800 84px Inter; letter-spacing: -.03em; }
  .caret { display: inline-block; width: 6px; height: 78px; background: #36d97c; vertical-align: -12px; margin-left: 6px; }
  .hl { background: #36d97c; color: #04130a; padding: 0 .16em; border-radius: .14em; }
  .tw { position: absolute; width: 1000px; background: #fff; border-radius: 22px; padding: 26px 30px 24px; box-shadow: 0 30px 80px rgba(9,60,30,.22), 0 2px 0 rgba(0,0,0,.04); color: #0f1419; transform-origin: 50% 60%; }
  .tw .h { display: flex; align-items: center; gap: 14px; }
  .tw .av { width: 68px; height: 68px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #e6ece8; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tw .av img { width: 56px; height: 56px; }
  .tw .av img.full { width: 68px; height: 68px; }
  .tw .nm { font: 800 28px Inter; }
  .tw .hd { font: 500 24px Inter; color: #536471; }
  .tw .x { margin-left: auto; width: 32px; height: 32px; }
  .tw .tx { margin-top: 18px; font: 500 34px/1.36 Inter; white-space: pre-line; }
  .tw .md { margin-top: 20px; border-radius: 18px; overflow: hidden; height: 420px; background: #000; }
  .tw .md img { width: 100%; height: 100%; object-fit: cover; }
  .big { position: absolute; left: 0; right: 0; text-align: center; font: 900 140px Inter; letter-spacing: -.045em; color: #04130a; }
  .big span, .type span { display: inline-block; margin: 0 .1em; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font: 800 70px Inter; letter-spacing: -.03em; color: #04130a; }
  .label { position: absolute; left: 0; right: 0; text-align: center; font: 700 22px Inter; letter-spacing: .3em; color: #1f9a55; }
  #full img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #fullCap { position: absolute; left: 90px; bottom: 90px; color: #fff; font: 800 64px Inter; letter-spacing: -.03em; text-shadow: 0 4px 40px rgba(0,0,0,.8); }
  #end { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #end img.lg { width: 430px; height: 430px; }
  #end .u { margin-top: 10px; font: 700 26px Inter; letter-spacing: .1em; }
  #end .pf { margin-top: 26px; display: flex; align-items: center; gap: 12px; font: 500 18px Inter; color: rgba(255,255,255,.78); }
  #end .pf img { width: 44px; height: 44px; }
  #end .d { margin-top: 18px; font-size: 14px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="layer" id="black" style="background:#000"></div>
<div class="layer" id="mint"></div>
<div id="rings"></div>
<div class="layer" id="full"><img id="fullA" src="floor_13.jpg"><img id="fullB" src="floor_24.jpg"><div id="fullCap"></div></div>
<div class="layer" id="stage"></div>
<div class="layer" id="end"><img class="lg" src="../brand/trenchers_logo_text.png"><div class="u" id="endU"></div><div class="pf"><img src="../brand/pumpfun.svg">Built on the pump.fun Squads Competition</div><div class="d">Independent fan project. Not affiliated with pump.fun.</div></div>
<script>window.READY = false</script>
<script type="module">
import PROJECT from '../project.config.js'
const Q = new URLSearchParams(location.search)
const HANDLE = Q.get('handle') || 'squadtrenchers', SITE = Q.get('site') || 'squadsgp.vercel.app'
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const E3 = (x) => 1 - Math.pow(1 - clamp(x), 3)
const back = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }   // overshoot: the bounce of a pop
const ramp = (t, a, b, f = .3) => clamp((t - a) / f) * clamp((b - t) / f)
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
const X_ICON = '<svg class="x" viewBox="0 0 24 24"><path fill="#0f1419" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
// pump.fun's real posts, quoted word for word (dates from the posts)
const PF = { name: 'Pump.fun', handle: 'Pumpfun', av: '../brand/pumpfun.svg' }
const TWEETS = {
  comp: { ...PF, date: 'Oct 26', text: 'The $2,500,000 SQUADS COMPETITION is LIVE\n\nFor the next 2 weeks, the 3 squads with the highest PNL will take home:\n\n🥇 $1,500,000\n🥈 $750,000\n🥉 $250,000' },
  dabal: { ...PF, date: 'Oct 26', text: 'DABAL.\n\nNOW TRADING ON PUMPFUN.' },
  conv: { ...PF, date: 'Oct 24', text: 'Conviction Capital.\n\nSquad now trading on Pumpfun.' },
  ours: { name: PROJECT.name, handle: HANDLE, av: '../brand/trenchers_coin.png', full: true, date: 'Now', text: 'We put every squad in the $2.5M pump.fun competition on one trading floor.\n\nTheir profit on their screens. Live.', media: 'floor_5.jpg' },
}
const card = (k, hl) => {
  const w = TWEETS[k]; let text = esc(w.text); if (hl) text = text.replace(hl, `<span class="hl">${hl}</span>`)
  return `<div class="tw" id="tw_${k}"><div class="h"><div class="av"><img src="${w.av}" class="${w.full ? 'full' : ''}"></div><div><div class="nm">${esc(w.name)}</div><div class="hd">@${esc(w.handle)} · ${w.date}</div></div>${X_ICON}</div><div class="tx">${text}</div>${w.media ? `<div class="md"><img id="md_${k}" src="${w.media}"></div>` : ''}</div>`
}
$('stage').innerHTML = card('comp') + card('dabal') + card('conv') + card('ours') +
  `<div class="type" id="type1"></div><div class="label" id="lab" style="top:150px"></div><div class="big" id="big" style="top:330px"></div><div class="sub" id="sub" style="top:560px"></div>`
$('endU').textContent = '$' + PROJECT.ticker + ' · ' + SITE
const place = (id, x, y, s = 1, r = 0, o = 1) => { const e = $(id); e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.transform = `translate(-50%, -50%) scale(${s}) rotate(${r}deg)`; e.style.opacity = o }
const words = (el, text, t0, t, opts = {}) => { el.innerHTML = text.split(' ').map((w, i) => { const k = E3((t - t0 - i * .12) / .35); const hl = opts.hl && opts.hl.includes(w) ? 'hl' : ''; return `<span class="${hl}" style="opacity:${k.toFixed(3)};filter:blur(${((1 - k) * 12).toFixed(1)}px);transform:translateY(${((1 - k) * 26).toFixed(1)}px)">${esc(w)}</span>` }).join(' ') }

window.DURATION = 24
window.renderFrame = (t) => {
  // 0-2.6: typed on black
  const line = 'pump.fun just started a war.', n = Math.floor(clamp((t - .3) / 1.5) * line.length)
  const typed = esc(line.slice(0, n)).replace('war.', '<span class="hl">war.</span>')
  $('type1').innerHTML = t < 2.7 ? typed + (Math.floor(t * 2.4) % 2 || n < line.length ? '<span class="caret"></span>' : '') : ''
  // mint world from 2.6 to 18.6, with green rings pulsing out on the pop
  $('mint').style.opacity = ramp(t, 2.55, 18.7, .15)
  $('rings').innerHTML = [0, 1, 2].map((i) => { const a = (t - 2.6 - i * .18) / 1.2; if (a < 0 || a > 1) return ''; return `<div class="ring" style="width:${200 + a * 1700}px;height:${200 + a * 1700}px;opacity:${(1 - a) * .7}"></div>` }).join('')
  // 2.6-7.4: the announcement pops in, its prize highlighted
  if (t > 4.4 && !$('tw_comp').innerHTML.includes('class="hl"')) $('tw_comp').outerHTML = card('comp', '$2,500,000')
  if (t <= 4.4 && $('tw_comp').innerHTML.includes('class="hl"')) $('tw_comp').outerHTML = card('comp')
  const c1 = back((t - 2.65) / .5), out1 = E3((t - 7.4) / .5)
  place('tw_comp', 960 - out1 * 1300, 540 + (1 - c1) * 60, .4 + .6 * c1 - out1 * .1, -out1 * 8, c1 > 0 ? 1 - out1 : 0)
  $('lab').textContent = t > 2.9 && t < 7.4 ? 'OCT 26 · PUMP.FUN' : ''; $('lab').style.opacity = ramp(t, 2.9, 7.4)
  // 7.4-10.8: the squads arrive, fanned
  const c2 = back((t - 7.5) / .5), c3 = back((t - 7.85) / .5), out23 = E3((t - 10.6) / .4)
  place('tw_dabal', 600 + (1 - c2) * -600, 450, .78, -6 + out23 * -10, c2 > 0 ? 1 - out23 : 0)
  place('tw_conv', 1320 + (1 - c3) * 600, 630, .78, 5 + out23 * 10, c3 > 0 ? 1 - out23 : 0)
  // 10.8-13.4: the stakes, word by word
  if (t >= 10.8 && t < 13.5) { words($('big'), (window.N || '962') + ' squads.', 10.85, t); words($('sub'), 'Two weeks. One winner.', 11.9, t, { hl: ['One', 'winner.'] }); $('big').style.opacity = $('sub').style.opacity = clamp((13.5 - t) / .25) } else { $('big').innerHTML = $('sub').innerHTML = '' }
  // 13.4-18.6: our post, then its image grows into the footage
  const c4 = back((t - 13.5) / .55), grow = E3((t - 17.7) / .9)
  place('tw_ours', 960, 540 + (1 - c4) * 80, (.4 + .6 * c4) * .92 * (1 + grow * .25), 0, c4 > 0 ? 1 - clamp((t - 17.85) / .35) : 0)
  const md = $('md_ours'); if (md) md.style.transform = `scale(${1.05 + .06 * clamp((t - 13.5) / 5)})`
  // 18.4-21.4: full-screen floor footage, two stills with a slow push
  const fo = ramp(t, 17.8, 21.4, .4); $('full').style.opacity = fo
  const kA = clamp((t - 18.3) / 1.6), kB = clamp((t - 19.8) / 1.6)
  $('fullA').style.transform = `scale(${1.04 + .06 * kA})`; $('fullB').style.opacity = E3((t - 19.8) / .4); $('fullB').style.transform = `scale(${1.04 + .06 * kB})`
  words($('fullCap'), 'Every squad. One floor.', 18.6, t); $('fullCap').style.opacity = fo
  // 21.4-24: the end card
  $('end').style.opacity = E3((t - 21.4) / .5)
}
fetch('../api/board').then((r) => r.ok ? r.json() : null).then((d) => { if (d?.competition?.entriesCount) window.N = d.competition.entriesCount.toLocaleString('en-US') }).catch(() => {}).finally(() => document.fonts.ready.then(() => { window.renderFrame(0); window.READY = true }))
</script>
</body>
</html>
